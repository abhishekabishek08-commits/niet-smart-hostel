<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIET Smart Hostel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            background: linear-gradient(135deg, #f0f9ff 0%, #e0e7ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: var(--text-main);
        }
        .container { 
            background: white; 
            padding: 50px 40px; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.08); 
            text-align: center;
            max-width: 450px;
            width: 90%;
            border: 1px solid rgba(255,255,255,0.5);
        }
        .college-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .icon {
            font-size: 50px;
            margin-bottom: 15px;
            background: #eff6ff;
            width: 90px;
            height: 90px;
            line-height: 90px;
            border-radius: 50%;
            display: inline-block;
        }
        h1 {
            font-size: 28px;
            font-weight: 800;
            margin: 0 0 10px;
            color: var(--text-main);
            line-height: 1.2;
        }
        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 35px;
            font-size: 15px;
            line-height: 1.5;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .btn { 
            padding: 16px; 
            font-size: 16px;
            font-weight: 600;
            text-decoration: none; 
            color: white; 
            background-color: var(--primary); 
            border-radius: 12px; 
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2);
        }
        .btn:hover { 
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
        }
        .btn.student { background-color: #2563eb; }
        .btn.student:hover { background-color: #1d4ed8; }
        .btn.warden { background-color: #059669; box-shadow: 0 4px 6px rgba(5, 150, 105, 0.2); }
        .btn.warden:hover { background-color: #047857; }
        .btn.staff { background-color: #d97706; box-shadow: 0 4px 6px rgba(217, 119, 6, 0.2); }
        .btn.staff:hover { background-color: #b45309; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🎓</div>
        <div class="college-name">Nehru Institute of Engineering and Technology</div>
        <h1>Smart Hostel</h1>
        <p class="subtitle">Welcome to the NIET Hostel Complaint Management Portal. Select your role to continue.</p>
        
        <div class="btn-group">
            <a href="/student" class="btn student">👤 Login as Student</a>
            <a href="/warden" class="btn warden">🛡️ Login as Warden</a>
            <a href="/staff" class="btn staff">🔧 Login as Maintenance</a>
        </div>
    </div>
</body>
</html>
